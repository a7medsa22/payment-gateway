services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_gateway_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      retries: 15
  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
